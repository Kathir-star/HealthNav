  <circle cx="64" cy="64" r="36" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="40" y1="36" x2="64" y2="64" stroke="#00f0ff" stroke-width="2" opacity="0.7"/>
  <line x1="88" y1="36" x2="64" y2="64" stroke="#00f0ff" stroke-width="2" opacity="0.7"/>
  <line x1="88" y1="92" x2="64" y2="64" stroke="#00f0ff" stroke-width="2" opacity="0.7"/>
  <circle cx="40" cy="36" r="4" fill="#00f0ff" />
  <circle cx="88" cy="36" r="4" fill="#00f0ff" />
  <circle cx="88" cy="92" r="4" fill="#00f0ff" />
  
